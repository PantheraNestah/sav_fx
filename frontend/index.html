<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%234fd1c5%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial%27 font-weight=%27800%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%2309202a%27%3ED%3C/text%3E%3C/svg%3E" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#091321" />
    <style>
      /* Pre-paint defaults so there is no white/dark flash before the bundle loads */
      html { background: #091321; color-scheme: dark; }
      html[data-theme='light'] { background: #f3f8fa; color-scheme: light; }
    </style>
    <script>
      // Resolve the theme before first paint (stored choice, else OS preference).
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('dash-theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          try {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } catch (e) {
            t = 'dark';
          }
        }
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f3f8fa' : '#091321');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Dash</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
